# Base config for real training runs
model:
  dim: 768
  n_layers: 12
  n_heads: 12
  head_dim: 64
  vocab_size: 32768
  max_seq_len: 2048
  dropout: 0.0
  norm_eps: 1e-5
  rope_theta: 500000.0

training:
  batch_size: 128
  micro_batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 3e-4
  min_lr: 3e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_steps: 100000
  warmup_steps: 1000
  max_grad_norm: 1.0
  mixed_precision: true
  log_interval: 10
  save_interval: 1000
  eval_interval: 500

data:
  train_path: "data/train.txt"
  eval_path: "data/eval.txt"
  tokenizer_path: "data/tokenizer.json"
  num_workers: 4
  pin_memory: true

checkpoint:
  save_dir: "checkpoints"
  resume: null
  save_optimizer: true

logging:
  wandb: false
  tensorboard: true
  log_dir: "logs"
