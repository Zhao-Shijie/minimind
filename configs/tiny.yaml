# Tiny config for fast smoke-testing (CPU compatible)
model:
  dim: 256
  n_layers: 4
  n_heads: 4
  head_dim: 64
  vocab_size: 4096
  max_seq_len: 256
  dropout: 0.0
  norm_eps: 1e-5
  rope_theta: 10000.0

training:
  batch_size: 4
  micro_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 3e-4
  min_lr: 3e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_steps: 50
  warmup_steps: 5
  max_grad_norm: 1.0
  mixed_precision: false
  log_interval: 5
  save_interval: 25
  eval_interval: 25

data:
  train_path: "data/train.txt"
  eval_path: "data/eval.txt"
  tokenizer_path: "data/tokenizer.json"
  num_workers: 0
  pin_memory: false

checkpoint:
  save_dir: "checkpoints"
  resume: null
  save_optimizer: true

logging:
  wandb: false
  tensorboard: true
  log_dir: "logs"
